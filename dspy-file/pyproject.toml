[project]
name = "dspy-file-teaching-analyzer"
version = "0.1.1"
description = "CLI utility that summarizes single files into teaching briefs using DSPy"
authors = [{ name = "Your Name", email = "you@example.com" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dspy>=2.6",
    "python-dotenv>=1.0",
]

[project.scripts]
dspy-file-teaching = "dspy_file.analyze_file_cli:main"

[tool.setuptools.packages.find]
include = ["dspy_file", "dspy_file.*"]
